    <meta property="og:type" content="website">
    <meta property="og:url" content="https://arihant-jha.github.io/404.html">
    
    <script>
      (function () {
        var theme;
        try {
          theme = localStorage.getItem("theme");
        } catch (error) {
          theme = null;
        }

        if (theme === "light" || theme === "dark") {
          document.documentElement.dataset.theme = theme;
        }
      }());
    </script>
    <link rel="stylesheet" href="/assets/site.css">
  </head>
  <body>
    <button class="theme-toggle" type="button" aria-label="Switch color theme">Theme</button>
    <main>
      <section class="hero">
  <p class="eyebrow">/404</p>
  <h1>Page not found.</h1>
  <p class="intro"><a href="/">Return to the blog.</a></p>
</section>

    </main>
    <script>
      (function () {
        var button = document.querySelector(".theme-toggle");
        var media = window.matchMedia("(prefers-color-scheme: dark)");

        function activeTheme() {
          return document.documentElement.dataset.theme || (media.matches ? "dark" : "light");
        }

        function render() {
          var theme = activeTheme();
          button.textContent = theme === "dark" ? "Light" : "Dark";
          button.setAttribute("aria-label", "Switch to " + button.textContent.toLowerCase() + " mode");
        }

        button.addEventListener("click", function () {
          var next = activeTheme() === "dark" ? "light" : "dark";
          document.documentElement.dataset.theme = next;
          try {
            localStorage.setItem("theme", next);
          } catch (error) {
            /* Preference persistence is optional. */
          }

          render();
        });

        media.addEventListener("change", function () {
          if (!document.documentElement.dataset.theme) render();
        });

        render();
      }());
    </script>
  </body>
</html>

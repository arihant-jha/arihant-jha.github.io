<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Emberwood Blog</title>
    <style>
      :root {
        color-scheme: light;
        font-family: "Alegreya", "Times New Roman", serif;
        background: #f7f3ef;
        color: #1f1b16;
      }
      html, body {
        margin: 0;
        padding: 0;
        height: 100%;
      }
      body {
        display: flex;
        flex-direction: column;
        min-height: 100vh;
      }
      header {
        padding: 24px 28px;
        border-bottom: 1px solid #e2d7c9;
        background: linear-gradient(135deg, #f7f3ef 0%, #efe6db 100%);
      }
      header h1 {
        margin: 0 0 6px;
        font-size: 28px;
        letter-spacing: 0.5px;
      }
      header p {
        margin: 0;
        color: #5a5147;
      }
      .frame-wrap {
        flex: 1;
        position: relative;
      }
      iframe {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        border: 0;
        background: white;
      }
      footer {
        padding: 12px 28px 20px;
        border-top: 1px solid #e2d7c9;
        font-size: 13px;
        color: #6a5f54;
        background: #f7f3ef;
      }
      @media (max-width: 700px) {
        header {
          padding: 20px;
        }
        header h1 {
          font-size: 22px;
        }
      }
    </style>
  </head>
  <body>
    <header>
      <h1>Emberwood Blog</h1>
      <p>Hosted on Railway, embedded here for a seamless read.</p>
    </header>
    <main class="frame-wrap">
      <iframe
        src="https://emberwood-blog-production.up.railway.app"
        title="Emberwood Blog"
        loading="lazy"
        referrerpolicy="no-referrer"
        allow="fullscreen"
      ></iframe>
    </main>
    <footer>
      <span>Tip: open the blog directly if it feels cramped.</span>
    </footer>
  </body>
</html>

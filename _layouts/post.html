---
layout: default
---

<article class="post">
  <header class="post-header">
    <div class="post-meta">
      <a class="back-link" href="{{ '/' | relative_url }}">Arihant Jha / Writing</a>
      <time datetime="{{ page.date | date_to_xmlschema }}">{{ page.date | date: "%Y.%m.%d" }}</time>
    </div>
    <h1>{{ page.title }}</h1>
    {% if page.description %}
      <p>{{ page.description }}</p>
    {% endif %}
    {% if page.tags.size > 0 %}
      <ul class="tags" aria-label="Topics">
        {% for tag in page.tags %}
          <li>[{{ tag }}]</li>
        {% endfor %}
      </ul>
    {% endif %}
  </header>

  <div class="prose">
    {{ content }}
  </div>
</article>

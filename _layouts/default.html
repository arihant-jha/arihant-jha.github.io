<!doctype html>
<html lang="{{ site.lang | default: 'en' }}">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% if page.title %}{{ page.title }} | {% endif %}{{ site.title }}</title>
    <meta name="description" content="{{ page.description | default: site.description }}">
    <link rel="canonical" href="{{ page.url | absolute_url }}">
    <link rel="alternate" type="application/atom+xml" title="{{ site.title }}" href="{{ '/feed.xml' | absolute_url }}">
    <meta property="og:title" content="{% if page.title %}{{ page.title }}{% else %}{{ site.title }}{% endif %}">
    <meta property="og:description" content="{{ page.description | default: site.description }}">
    <meta property="og:type" content="{% if page.layout == 'post' %}article{% else %}website{% endif %}">
    <meta property="og:url" content="{{ page.url | absolute_url }}">
    <script>
      (function () {
        var theme;
        try {
          theme = localStorage.getItem("theme");
        } catch (error) {
          theme = null;
        }

        if (theme === "light" || theme === "dark") {
          document.documentElement.dataset.theme = theme;
        }
      }());
    </script>
    <link rel="stylesheet" href="{{ '/assets/site.css' | relative_url }}">
  </head>
  <body>
    <button class="theme-toggle" type="button" aria-label="Switch color theme">Theme</button>
    <main>
      {{ content }}
    </main>
    <script>
      (function () {
        var button = document.querySelector(".theme-toggle");
        var media = window.matchMedia("(prefers-color-scheme: dark)");

        function activeTheme() {
          return document.documentElement.dataset.theme || (media.matches ? "dark" : "light");
        }

        function render() {
          var theme = activeTheme();
          button.textContent = theme === "dark" ? "Light" : "Dark";
          button.setAttribute("aria-label", "Switch to " + button.textContent.toLowerCase() + " mode");
        }

        button.addEventListener("click", function () {
          var next = activeTheme() === "dark" ? "light" : "dark";
          document.documentElement.dataset.theme = next;
          try {
            localStorage.setItem("theme", next);
          } catch (error) {
            /* Preference persistence is optional. */
          }

          render();
        });

        media.addEventListener("change", function () {
          if (!document.documentElement.dataset.theme) render();
        });

        render();
      }());
    </script>
  </body>
</html>
